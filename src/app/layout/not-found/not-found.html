@if (session$ | async; as session) {
  <app-shell [session]="session" heading="Page not found" (signOut)="signOut()">
    <section class="surface-card" aria-label="Page not found">
      <app-empty-state
        [level]="2"
        icon="compass"
        heading="We couldn't find that page"
        message="The link may be out of date, or the page has moved. Your home page has everything that's current."
      >
        <a class="btn btn--primary btn--sm" [routerLink]="homePath()">
          <svg lucideIcon="arrow-left" [size]="16"></svg>
          Back to your home page
        </a>
      </app-empty-state>
    </section>
  </app-shell>
} @else {
  <main class="not-found" id="main-content">
    <article class="not-found__card">
      <span class="not-found__icon" aria-hidden="true">
        <svg lucideIcon="compass" [size]="22"></svg>
      </span>
      <h1>We couldn't find that page</h1>
      <p class="not-found__text">
        The link may be out of date, or the page has moved. Sign in to pick up where you left off.
      </p>
      <a class="btn btn--primary" routerLink="/login">
        <svg lucideIcon="arrow-left"></svg>
        Go to sign in
      </a>
    </article>
  </main>
}
