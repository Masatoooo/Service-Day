<div class="empty">
  <span class="empty__icon">
    <svg [lucideIcon]="icon()" [size]="20"></svg>
  </span>
  <div class="empty__body">
    @if (level() === 2) {
      <h2 class="empty__heading">{{ heading() }}</h2>
    } @else {
      <h3 class="empty__heading">{{ heading() }}</h3>
    }
    <p class="empty__message">{{ message() }}</p>
    <div class="empty__actions">
      <ng-content />
    </div>
  </div>
</div>
