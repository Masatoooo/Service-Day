<div class="pills" role="group" [attr.aria-label]="label()">
  @for (option of options(); track option.value) {
    <button
      type="button"
      class="pill-btn"
      [attr.aria-pressed]="option.value === selected()"
      (click)="select(option.value)"
    >
      {{ option.label }}
      @if (option.count !== undefined) {
        <span class="pill-btn__count tabular">{{ option.count }}</span>
      }
    </button>
  }
</div>
