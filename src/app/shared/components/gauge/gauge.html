<figure class="gauge" role="img" [attr.aria-label]="label() + ': ' + clamped() + '%'">
  <svg class="gauge__arc" viewBox="0 0 240 136" aria-hidden="true">
    @for (bar of bars(); track $index) {
      <line
        class="gauge__bar"
        [class.is-filled]="bar.filled"
        [attr.x1]="bar.x1"
        [attr.y1]="bar.y1"
        [attr.x2]="bar.x2"
        [attr.y2]="bar.y2"
      />
    }
  </svg>
  <figcaption class="gauge__readout" aria-hidden="true">
    <span class="gauge__value tabular">{{ clamped() }}<span class="gauge__unit">%</span></span>
    <span class="gauge__label">{{ label() }}</span>
  </figcaption>
</figure>
